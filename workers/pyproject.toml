[project]
name = "atlas-planning-runtime"
version = "0.1.0"
description = "Isolated model and browser execution for the Jac Atlas application"
requires-python = ">=3.11"
dependencies = [
  "anthropic==2.8.0", "playwright==1.65.2", "pydantic==2.14.3",
  "python-dotenv==1.2.4", "pypdf==7.1.0", "astral==3.2",
  "timezonefinder==9.2.0",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../web"]
