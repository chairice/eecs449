&lt;style&gt;
  #detour-system {
    --dt-bg: light-dark(#f5f2eb, #111412);
    --dt-surface: light-dark(#fffefb, #191d1a);
    --dt-surface-2: light-dark(#ece9e1, #222722);
    --dt-ink: light-dark(#17221b, #f2f5f0);
    --dt-muted: light-dark(#68736b, #a8b2aa);
    --dt-border: light-dark(#dad6cc, #343b35);
    --dt-green: light-dark(#1d5d3c, #9bd9b0);
    --dt-green-ink: light-dark(#f8fff9, #102217);
    --dt-green-soft: light-dark(#e0efe5, #243e2d);
    --dt-amber: light-dark(#fff0c9, #47391b);
    --dt-amber-ink: light-dark(#6c4d00, #f4d579);
    --dt-red-soft: light-dark(#f9e3df, #482926);
    --dt-shadow: light-dark(0 24px 74px rgba(31, 44, 35, .13), 0 24px 74px rgba(0, 0, 0, .32));
    color-scheme: light dark;
    width: 100%;
    color: var(--dt-ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
  }
  #detour-system * { box-sizing: border-box; }
  #detour-system &gt; .viz-controls { margin: 0 0 12px; }
  #detour-system .dt-window { overflow: hidden; min-height: 720px; background: var(--dt-bg); border: 1px solid var(--dt-border); border-radius: 24px; box-shadow: var(--dt-shadow); }
  #detour-system .dt-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--dt-ink); text-decoration: none; font-weight: 500; letter-spacing: -.02em; }
  #detour-system .dt-logo, #detour-system .dt-mode, #detour-system .dt-state-icon, #detour-system .dt-loading-mark { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--dt-green); color: var(--dt-green-ink); }
  #detour-system .dt-public-header, #detour-system .dt-app-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 72px; padding: 0 32px; background: var(--dt-surface); border-bottom: 1px solid var(--dt-border); }
  #detour-system .dt-public-header nav { display: flex; gap: 28px; }
  #detour-system .dt-public-header nav a { color: var(--dt-muted); text-decoration: none; font-size: 13px; }
  #detour-system .dt-public-header &gt; button { justify-self: end; }
  #detour-system button, #detour-system input, #detour-system textarea, #detour-system select { font: inherit; }
  #detour-system .dt-primary, #detour-system .dt-secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 15px; border-radius: 11px; font-size: 13px; font-weight: 500; }
  #detour-system .dt-primary { border: 0; background: var(--dt-green); color: var(--dt-green-ink); }
  #detour-system .dt-secondary { border: 1px solid var(--dt-border); background: var(--dt-surface); color: var(--dt-ink); }
  #detour-system .dt-full { width: 100%; }
  #detour-system .dt-kicker { margin: 0; color: var(--dt-green); font-size: 11px; font-weight: 500; letter-spacing: .12em; }
  #detour-system h1, #detour-system h2, #detour-system p { margin-top: 0; }
  #detour-system .dt-landing-main { max-width: 1120px; margin: 0 auto; padding: 76px 44px 54px; }
  #detour-system .dt-landing-main::after { content: &quot;&quot;; display: table; clear: both; }
  #detour-system .dt-landing-copy { float: left; width: 52%; padding: 34px 52px 0 0; }
  #detour-system .dt-landing-copy h1 { margin: 9px 0 20px; font-family: Georgia, &quot;Times New Roman&quot;, serif; font-size: clamp(44px, 6vw, 72px); line-height: .98; font-weight: 500; letter-spacing: -.045em; }
  #detour-system .dt-landing-copy &gt; p:not(.dt-kicker) { max-width: 570px; color: var(--dt-muted); font-size: 17px; line-height: 1.6; }
  #detour-system .dt-landing-actions { display: flex; align-items: center; gap: 15px; margin-top: 28px; }
  #detour-system .dt-landing-actions span { color: var(--dt-muted); font-size: 12px; }
  #detour-system .dt-conversation { float: right; width: 44%; display: grid; gap: 12px; padding: 26px; background: var(--dt-surface); border: 1px solid var(--dt-border); border-radius: 20px; }

  #detour-system .dt-message-agent p { margin: 0; }
  #detour-system .dt-message-agent span { color: var(--dt-green); }
  #detour-system .dt-mini-route { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-top: 4px; padding: 13px; border: 1px solid var(--dt-border); border-radius: 12px; }
  #detour-system .dt-mini-route &gt; span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--dt-green); background: var(--dt-green-soft); }

  #detour-system .dt-mini-route strong { font-size: 12px; font-weight: 500; }
  #detour-system .dt-mini-route small { margin-top: 2px; color: var(--dt-muted); font-size: 10px; }
  #detour-system .dt-mini-route b { color: var(--dt-green); font-size: 10px; font-weight: 500; }
  #detour-system .dt-feature-row { clear: both; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; padding-top: 72px; }
  #detour-system .dt-feature-row div { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: start; }
  #detour-system .dt-feature-row i { grid-row: span 2; color: var(--dt-green); }
  #detour-system .dt-feature-row strong { font-size: 13px; font-weight: 500; }
  #detour-system .dt-feature-row span { color: var(--dt-muted); font-size: 12px; line-height: 1.45; }
  #detour-system .dt-app-header { position: relative; }
  #detour-system .dt-app-nav { display: flex; gap: 7px; }

&lt;script&gt;
  (() =&gt; {

    const marketing = root.querySelector(&#x27;[data-page=&quot;landing&quot;]&#x27;);

      event.preventDefault();
      show(control.dataset.go);

    const routeCopy = {
      train: [&#x27;Take the Wolverine&#x27;, &#x27;It is the fastest direct option and avoids transfer risk. Rain may cause a short departure delay, but this route still has the best buffer.&#x27;, &#x27;Rain near departure&#x27;, &#x27;Heavy rain is possible from 5–7 PM. Leave 20 minutes early.&#x27;, &#x27;5:42 PM&#x27;, &#x27;6:17 PM&#x27;, &#x27;10:32 PM&#x27;],

      mixed: [&#x27;Keep this as a backup&#x27;, &#x27;The transfer is comfortable, but this itinerary is slower and adds another failure point.&#x27;, &#x27;One protected transfer&#x27;, &#x27;The 42-minute connection is safe unless the first leg slips significantly.&#x27;, &#x27;4:05 PM&#x27;, &#x27;4:35 PM&#x27;, &#x27;10:27 PM&#x27;]

    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
