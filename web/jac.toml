[project]
name = "everyday-agent-web"
version = "0.1.0"
jac-version = "==0.37.14"
description = "Landing page for the EECS 449 everyday AI agent project"
entry-point = "main"
kind = "web-app"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
leaflet = "^1.9.4"
react-markdown = "10.1.0"
remark-gfm = "4.0.1"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "^4.3.3"
"@tailwindcss/vite" = "^4.3.3"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
host = "127.0.0.1"
base_route_app = "app"

[placement.pins]
"client.atlas_flow" = "client"
"client.planning_state" = "client"
"client.theme_mode" = "client"
"components.StudioOffers" = "client"

# What a browser tab and a shared link show.
[client.app_meta_data]
title = "Detour · Your next journey"
description = "Plan your kind of trip, together with Detour."

# Paint the remembered light/dark theme before the bundle loads, so the first
# frame has the right palette. Mirrors client/theme_mode.jac (same key and rule).
[[client.app_meta_data.scripts]]
content = """
(function () {
  var root = document.documentElement, pref = null, dark = false;
  try { pref = window.localStorage.getItem("detour.theme.v1"); } catch (e) {}
  try { dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) {}
  var path = window.location.pathname.toLowerCase();
  while (path.length > 1 && path.endsWith("/")) path = path.slice(0, -1);
  if (path === "/") dark = false;
  else if (path === "/studio") dark = true;
  root.setAttribute("data-theme", dark ? "dark" : "light");
  root.style.colorScheme = dark ? "dark" : "light";
})();
"""

# Tailwind v4 utilities, layered above the hand-written styles (see tailwind.css).
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.pwa]
theme_color = "#121715"
background_color = "#121715"
cache_name = "atlas-studio-v1"
install_banner = false

[client.pwa.manifest]
name = "Detour Travel Studio"
short_name = "Detour"
description = "Your next journey, thoughtfully planned."
start_url = "/studio"
