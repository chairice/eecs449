[project]
name = "everyday-agent-web"
version = "0.1.0"
jac-version = "==0.37.14"
description = "Landing page for the EECS 449 everyday AI agent project"
entry-point = "main"
kind = "web-app"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
leaflet = "^1.9.4"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
host = "127.0.0.1"
base_route_app = "app"

# Plain-language trip requests (server/interpret.jac). The key comes only from
# the ANTHROPIC_API_KEY environment variable; without it the rule-based reader
# answers instead. DETOUR_MODEL overrides the model for one deployment.
[byllm.model]
default_model = "${DETOUR_MODEL:-anthropic/claude-haiku-5-5}"

# What a browser tab and a shared link show.
[client.app_meta_data]
title = "Detour"
description = "Plan a train or bus trip in one sentence. Detour compares the routes and spells out what's known, and what isn't."
